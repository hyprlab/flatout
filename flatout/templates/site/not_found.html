{% extends "site/layout.html" %}
{% block title %}Page not found · {{ s.fill(s.doc.app.name) }}{% endblock %}
{% block body %}
<main id="main" class="page page--center">
  <div class="container cta">
    <img class="cta__icon" src="{{ s.icon_url }}" alt="" width="88" height="88">
    <h1 class="section__title">There is nothing at this address</h1>
    <p class="section__lead">The page may have moved, or the link may be mistyped.</p>
    <div class="actions"><a class="btn btn--primary" href="{{ url_for('public.home') }}">Go to the homepage</a></div>
  </div>
</main>
{% endblock %}
