{% from "site/macros.html" import head, picture %}
<section id="{{ sec.id }}" class="section" data-section="{{ sec.id }}">
  <div class="container">
    {{ head(s, sec) }}
    <div class="gallery gallery--{{ [sec['items']|selectattr('image')|list|length, 3]|min }}">
      {%- for item in sec['items'] if item.image %}
      <figure class="gallery__item reveal-me">
        <div class="gallery__frame">{{ picture(item.image, item.image_dark, s.fill(item.alt), '', 'data-zoom') }}</div>
        {%- if item.title or item.caption %}
        <figcaption>{% if item.title %}<strong>{{ s.fill(item.title) }}</strong> {% endif %}{{ s.fill(item.caption) }}</figcaption>
        {%- endif %}
      </figure>
      {%- endfor %}
    </div>
  </div>
</section>
