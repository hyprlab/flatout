# The project name, fixed so the container and its volume keep their names
# whatever the folder is called.
name: flatout

services:
  flatout:
    # IMAGE_TAG=beta follows the beta channel; a version (1.4.0) pins one.
    image: hyprlab/flatout:${IMAGE_TAG:-latest}
    container_name: flatout
    ports:
      # host:container. Change the left side if 8102 is taken on your host.
      - "8102:8000"
    environment:
      # Session signing key. If unset, one is generated and kept in the volume.
      - SECRET_KEY=${SECRET_KEY:-}
      # Set to 1 when the site is served over HTTPS.
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-0}
      # How many reverse proxies sit in front (Cloudflare Tunnel, Caddy...).
      - TRUST_PROXY=${TRUST_PROXY:-0}
      # The largest bundle accepted, in megabytes.
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-2048}
      # Cloudflare Turnstile for the sign-in page. Usually set up in Settings > Security instead.
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
    volumes:
      # Everything: the database, uploads, the repository and its signing key.
      - flatout-data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  flatout-data:
